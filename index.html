<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://api.apolovibes3d.cl" crossorigin>
    <link rel="preconnect" href="https://api.apolovibes3d.cl">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" type="image/webp" href="/media/apolo-vibes-logo.webp" />
    <title>Apolo Vibes 3D</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('apolovibes_theme') || 'light'
          document.documentElement.setAttribute('data-theme', t)
          // Precargar el hero del tema activo (en oscuro cambia la imagen).
          var link = document.createElement('link')
          link.rel = 'preload'
          link.as = 'image'
          link.fetchPriority = 'high'
          link.href = t === 'dark' ? '/media/testModoOscuro.jfif' : '/media/apolohero2.webp'
          document.head.appendChild(link)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
